# Paper Radar — Render blueprint (worker: 3 components).
# The Next.js dashboard deploys separately on Vercel. Postgres is NOT
# provisioned here — this project uses a Neon database instead (Neon's free
# tier doesn't expire after 30 days the way Render's free Postgres does).
# Paste the Neon connection string into DATABASE_URL in the
# `paper-radar-shared` env group below after the first deploy.
#
# All three services are pinned to `region: ohio` because the Neon project is
# in AWS us-east-2 (Ohio) — same-region keeps DB round-trips in the low
# single-digit milliseconds. Cross-region (e.g. this blueprint applied from a
# default-region deploy) measured ~330ms per round trip in testing, which
# turns a ~500-paper ingest into tens of minutes of pure insert latency. If
# your Neon project is in a different region, change `region:` to match.
#
# ┌─ INSTANCE TIER ───────────────────────────────────────────────────────────┐
# │ Render's `free` plan is only a valid `plan:` value for `type: web`         │
# │ (confirmed against Render's blueprint schema — cron services reject it).   │
# │ So: the web service (2) runs on `free`. The two cron services (1, 3)       │
# │ must be `starter` at minimum — BUT Render bills cron jobs per execution-   │
# │ SECOND on that plan's rate, not a flat monthly fee: the daily run takes    │
# │ a few minutes, so actual cost is more like cents/month, not $7/mo flat.    │
# │ all-MiniLM-L6-v2 (default embedding model) should fit `starter`'s 512 MB.  │
# │ If Phase 2 profiling shows it needs more, or you switch to                 │
# │ `allenai/specter2_base` (~1-2 GB RSS), bump `paper-radar-daily` to         │
# │ `standard` — same per-second billing caveat applies. Record the profiled   │
# │ peak RSS here once measured on the real container.                        │
# └────────────────────────────────────────────────────────────────────────┘

envVarGroups:
  - name: paper-radar-shared
    envVars:
      - key: DATABASE_URL
        sync: false                  # paste the Neon connection string here
      - key: INTERNAL_SHARED_SECRET
        generateValue: true          # same generated value shared across all 3 services
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
      - key: CORE_API_KEY
        sync: false
      - key: CROSSREF_MAILTO
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false

services:
  # (1) daily pipeline
  - type: cron
    name: paper-radar-daily
    runtime: python
    region: ohio
    plan: starter                     # cron type has no free plan — see header box (per-second billing)
    schedule: "0 3 * * *"            # 03:00 UTC; adjust to config.timezone preference
    buildCommand: "pip install -r worker/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu"
    startCommand: "python -m worker.run"
    envVars:
      - fromGroup: paper-radar-shared

  # (2) small always-available API: dashboard-triggered term backfill + manual run
  - type: web
    name: paper-radar-worker-api
    runtime: python
    region: ohio
    plan: free                        # model-free, low traffic — free tier is plenty
    buildCommand: "pip install -r worker/requirements-core.txt"
    startCommand: "uvicorn worker.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - fromGroup: paper-radar-shared

  # (3) one-off bootstrap backfill. `schedule` is set to a date that never
  #     occurs (Feb 31) — trigger it manually from the Render dashboard once,
  #     it runs and exits.
  - type: cron
    name: paper-radar-bootstrap
    runtime: python
    region: ohio
    plan: starter                     # cron type has no free plan — see header box (per-second billing)
    schedule: "0 0 31 2 *"
    buildCommand: "pip install -r worker/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu"
    startCommand: "python -m worker.backfill"
    envVars:
      - fromGroup: paper-radar-shared

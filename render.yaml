# Paper Radar — Render blueprint.
# The Next.js dashboard deploys separately on Vercel. Postgres is NOT
# provisioned here — this project uses Neon instead (Neon's free tier doesn't
# expire after 30 days the way Render's free Postgres does).
#
# ONE service, on Render's free plan, no card required. Render Cron Jobs have
# no free tier at all (confirmed against Render's blueprint schema — `plan:
# free` is rejected for `type: cron`) and require a card on file even though
# actual usage-based cost would be pennies/month. Rather than ask for a card,
# the daily run and the one-off bootstrap are triggered over HTTP by a
# scheduled GitHub Actions workflow instead — see .github/workflows/daily.yml
# and .github/workflows/bootstrap.yml.
#
# Embeddings run via the Voyage AI hosted API (VOYAGE_API_KEY below) — one
# HTTP call, no local model, so worker/requirements-core.txt (no torch /
# sentence-transformers) fits comfortably in the free tier's 512 MB RAM, and
# clustering (numpy/scikit-learn/hdbscan — cheap on CPU, it's the neural
# embedding MODEL that needed RAM, not the clustering algorithm) works too.
# Voyage's 200M-token free grant covers years of this system's volume — see
# https://inferencehub.org/providers/voyage-ai. Without VOYAGE_API_KEY, both
# embeddings and clustering are skipped and scoring runs lexical +
# co-citation + HF-upvote only.
#
# To self-host the embedding model instead (no external API calls at all):
# switch buildCommand to worker/requirements.txt and bump `plan` to a paid
# tier with more RAM — a card is unavoidable at that point since it's a
# genuinely paid compute plan, not a billing quirk. See the Cost note there.
#
# All requests to Neon go over the public internet from wherever Render places
# this service — pin `region: ohio` to match Neon's `aws-us-east-2` project
# and keep DB round-trips in single-digit ms (measured ~330ms/round-trip
# cross-region in testing). If your Neon project is in a different region,
# change `region:` to match.

envVarGroups:
  - name: paper-radar-shared
    envVars:
      - key: DATABASE_URL
        sync: false                  # paste the Neon connection string here
      - key: INTERNAL_SHARED_SECRET
        generateValue: true          # also put this value in the GitHub Actions secrets
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OPENALEX_API_KEY
        sync: false
      - key: CORE_API_KEY
        sync: false
      - key: CROSSREF_MAILTO
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false                  # hosted embeddings — see the note above

services:
  - type: web
    name: paper-radar-worker-api
    runtime: python
    region: ohio
    plan: free                       # no card required
    buildCommand: "pip install -r worker/requirements-core.txt"
    startCommand: "uvicorn worker.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - fromGroup: paper-radar-shared
